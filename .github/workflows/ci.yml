# Pull requests: everything except deploy. Terraform plan runs with the
# read-only "plan" identity via OIDC (fork PRs get no OIDC token, by design).
name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      push: false

  terraform-plan:
    name: Terraform plan (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Entra ID
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Terraform provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-${{ runner.os }}-${{ hashFiles('infra/.terraform.lock.hcl') }}
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config=envs/dev.backend.hcl
      - run: terraform validate
      - name: terraform plan
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}"
          terraform plan -input=false -lock-timeout=120s -no-color \
            -var-file=envs/dev.tfvars -var="image=${image}" | tee plan.txt
          { echo '### Terraform plan (dev)'; echo '```'; tail -c 60000 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  kind:
    name: Kubernetes manifests on kind
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (GHA cache hit from the build job)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: platform-exercise:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: platex
      - name: Deploy and verify
        run: |
          kind load docker-image platform-exercise:ci --name platex
          sed 's|IMAGE_PLACEHOLDER|platform-exercise:ci|' k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml -f k8s/pdb.yaml -f k8s/networkpolicy.yaml
          kubectl rollout status deployment/platform-exercise --timeout=120s
          kubectl port-forward svc/platform-exercise 8080:80 >/dev/null 2>&1 &
          sleep 3
          curl -fsS --retry 5 --retry-connrefused http://localhost:8080/health
