# main: build + scan + push the image, then deploy it by digest with the
# environment-scoped "deploy" identity, then verify the live service.
name: cd

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      push: true

  deploy:
    name: Deploy to dev
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: dev # federated credential subject: repo:<owner>/<repo>:environment:dev
      url: ${{ steps.apply.outputs.app_url }}
    concurrency:
      group: deploy-dev
      cancel-in-progress: false # never interrupt a running apply
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_DEPLOY_CLIENT_ID }} # GitHub Environment variable
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform init -input=false -backend-config=envs/dev.backend.hcl
      - name: terraform apply
        id: apply
        run: |
          terraform apply -input=false -auto-approve -lock-timeout=120s \
            -var-file=envs/dev.tfvars -var="image=${{ needs.build.outputs.image }}"
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
      - name: Smoke test (health + deployed version)
        env:
          APP_URL: ${{ steps.apply.outputs.app_url }}
        run: |
          # Scale-to-zero means the first request may cold-start; retry.
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$APP_URL/health"
          deployed="$(curl -fsS --retry 5 --retry-all-errors "$APP_URL/" | jq -r .version)"
          echo "Deployed version: $deployed"
          test "$deployed" = "$GITHUB_SHA" || { echo "::error::expected $GITHUB_SHA, got $deployed"; exit 1; }
          echo "Smoke test passed for $APP_URL ($deployed)" >> "$GITHUB_STEP_SUMMARY"
